name: Build Dongchen Announcement Test JAR

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dongchen.jar'
      - 'announcement-src/**'
      - '.github/scripts/inject_announcement_hook.py'
      - '.github/workflows/build-announcement-jar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Smali tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsmali-java zip unzip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract dongchen.jar and disassemble original DEX
        run: |
          set -euo pipefail
          test -s dongchen.jar
          mkdir original smali
          unzip -q dongchen.jar -d original
          test -s original/classes.dex
          java -jar "$(find /usr/share/java -maxdepth 1 -name 'baksmali*.jar' | head -n 1)" disassemble original/classes.dex -o smali
          test -s smali/com/github/catvod/spider/Init.smali

      - name: Compile popup classes and merge into original DEX
        run: |
          set -euo pipefail
          mkdir -p build/classes build/newdex new-smali
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ANDROID_JAR" -d build/classes announcement-src/com/example/popup/AnnouncementPopup.java
          mapfile -t CLASS_FILES < <(find build/classes -type f -name '*.class' | sort)
          test "${#CLASS_FILES[@]}" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 21 --lib "$ANDROID_JAR" --output build/newdex "${CLASS_FILES[@]}"
          java -jar "$(find /usr/share/java -maxdepth 1 -name 'baksmali*.jar' | head -n 1)" disassemble build/newdex/classes.dex -o new-smali
          cp -a new-smali/. smali/

          cat > smali/com/example/popup/GateHook.smali <<'SMALI'
          .class public final Lcom/example/popup/GateHook;
          .super Ljava/lang/Object;
          .source "GateHook.java"

          .method private constructor <init>()V
              .registers 1
              invoke-direct {p0}, Ljava/lang/Object;-><init>()V
              return-void
          .end method

          .method public static run(Landroid/content/Context;)V
              .registers 2
              :try_start
              invoke-static {p0}, Lcom/example/popup/AnnouncementPopup;->run(Landroid/content/Context;)V
              :try_end
              goto :done
              .catch Ljava/lang/Throwable; {:try_start .. :try_end} :catch_all
              :catch_all
              move-exception v0
              :done
              return-void
          .end method
          SMALI

          python3 .github/scripts/inject_announcement_hook.py smali

          SMALI_JAR="$(find /usr/share/java -maxdepth 1 -name 'smali-[0-9]*.jar' | head -n 1)"
          test -n "$SMALI_JAR"
          java -jar "$SMALI_JAR" assemble smali -o build/classes.dex

      - name: Replace classes.dex and remove invalid old signatures
        run: |
          set -euo pipefail
          cp dongchen.jar dongchen-announcement-test.jar
          zip -q -d dongchen-announcement-test.jar classes.dex
          cp build/classes.dex ./classes.dex
          zip -X -q dongchen-announcement-test.jar classes.dex
          rm classes.dex
          zip -q -d dongchen-announcement-test.jar 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/SIG-*' || true
          unzip -t dongchen-announcement-test.jar
          test "$(unzip -p dongchen-announcement-test.jar classes.dex | wc -c)" -gt 1000000

      - name: Verify popup and actual Init hook in final JAR
        run: |
          set -euo pipefail
          mkdir verify
          unzip -p dongchen-announcement-test.jar classes.dex > verify/classes.dex
          java -jar "$(find /usr/share/java -maxdepth 1 -name 'baksmali*.jar' | head -n 1)" disassemble verify/classes.dex -o verify/smali
          grep -q 'Lcom/example/popup/AnnouncementPopup;' verify/smali/com/example/popup/GateHook.smali
          grep -q 'GateHook;->run(Landroid/content/Context;)V' verify/smali/com/github/catvod/spider/Init.smali
          test -s verify/smali/com/example/popup/AnnouncementPopup.smali
          echo "Final JAR static verification passed."

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: dongchen-announcement-test-jar
          path: dongchen-announcement-test.jar
          retention-days: 7
