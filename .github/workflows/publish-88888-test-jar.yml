name: Publish 88888 Test JAR Direct Download

on:
  workflow_run:
    workflows: ["Build 88888 Announcement Test JAR"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the artifact from this exact successful build
        uses: actions/download-artifact@v4
        with:
          name: 88888-announcement-test-jar
          path: ./release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s ./release/88888-announcement-test.jar
          if gh release view announcement-test-20261117 >/dev/null 2>&1; then
            gh release upload announcement-test-20261117 ./release/88888-announcement-test.jar --clobber
          else
            gh release create announcement-test-20261117 ./release/88888-announcement-test.jar \
              --title "88888 公告弹窗测试包" \
              --notes "公告弹窗测试包。由成功的 GitHub Actions 构建自动发布。"
          fi
